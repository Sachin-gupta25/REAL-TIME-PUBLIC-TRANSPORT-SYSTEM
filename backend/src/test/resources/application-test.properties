# Test Profile Configuration
server.port=0
spring.application.name=yatra-yatri-management-system-test

# In-memory H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT Configuration for Testing
jwt.secret=testSecretKey123456789012345678901234567890
jwt.expiration=86400000

# CORS Configuration for Testing
cors.allowed.origins=http://localhost:3000

# WebSocket Configuration for Testing
websocket.allowed.origins=http://localhost:3000

# Disable Actuator for Testing
management.endpoints.enabled-by-default=false

# Logging Configuration for Testing
logging.level.com.yatrayatri=DEBUG
logging.level.org.springframework.security=WARN